name: CRT Scanner

on:
  schedule:
    # Run every 5 minutes.
    # This ensures we don't miss the 20-minute
    # window after each 4H candle close.
    - cron: "*/5 * * * *"

  # Allows you to manually run the workflow
  # from GitHub Actions.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run CRT Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python crt_scanner_bot.py

      - name: Save updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add crt_state.json

          git diff --cached --quiet || git commit -m "Update CRT scanner state"

          git push
